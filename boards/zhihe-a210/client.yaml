# Labgrid client configuration for pool-based Zhihe A210 reservation (`pool=a210-yocto`).
# Usage with `LG_TOKEN` from `eval $(labgrid-client reserve --wait --shell pool=a210-yocto)`:
#   pytest --lg-env boards/zhihe-a210/client.yaml boards/zhihe-a210/pytest
targets:
  main:
    resources:
      RemotePlace:
        name: +
    drivers:
      - SerialDriver:
          name: console
          txdelay: 0.004
      - UBootDriver:
          name: uboot
          prompt: 'u-boot#'
          autoboot: 'Hit any key to stop autoboot: +[1-9]'
          interrupt: ' '
          boot_commands:
            emmc: 'run bootcmd'
            tftp: 'booti 0x84000000 0x8d000000:${filesize} 0x8c000000'
          bindings:
            console: console
          login_timeout: 60
          boot_timeout: 60
          strip_timestamp: True
      - ShellDriver:
          name: shell
          prompt: 'root@zhihe-a210:[^#]*# '
          login_prompt: 'zhihe-a210 login: '
          username: 'root'
          bindings:
            console: console
          login_timeout: 110
          await_login_timeout: 2
          post_login_settle_time: 1
      - ZhiheA210TftpBootStrategy:
          name: strategy
          bindings:
            console: console
            uboot: uboot
            shell: shell

imports:
  - strategy.py
